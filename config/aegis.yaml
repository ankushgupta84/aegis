# Aegis configuration.
#
# Resolution order, narrowest wins: built-in profile -> the global sections here -> each route.
# Every value a profile supplies is listed under "Profile defaults" below, and
# `aegis explain config/aegis.yaml` prints the value in force for every knob and where it came from.
#
# Profile defaults        strict     balanced   easy
#   waf.on_body_over_limit  block      pass       pass
#   waf.on_budget_exceeded  block      block      pass
#   waf.on_engine_error     block      block      pass
# All profiles: block_threshold 5, body_scan_limit 128KB, inspection_budget 5ms.

profile: balanced

listener:
  bind: 0.0.0.0
  port: 8443
  tls: true
  max_header_bytes: 16KB
  max_body_bytes: 10MB
  header_timeout: 10s
  idle_timeout: 60s
  drain_timeout: 30s

# /metrics and /healthz. Unauthenticated: keep it on localhost.
admin:
  enabled: true
  bind: 127.0.0.1
  port: 9090

log:
  directory: logs
  rotate_at: 100MB
  keep_files: 10
  # Query parameter values are masked in logs unless the name is listed here.
  logged_query_params: [page, limit, sort]

# The TCP peer is the client. List proxies here only if they sit in front of Aegis and you
# control them; then X-Forwarded-For is believed, from the right, up to the first untrusted hop.
client_ip:
  trusted_proxies: []

firewall:
  allow: []          # when non-empty, only these clients are admitted
  deny:
    - 203.0.113.0/24
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 50
    ipv4_prefix: 32
    ipv6_prefix: 64
    max_tracked_clients: 100000

# Suricata rule files, imported unchanged.
rule_sets:
  - name: aegis-core
    file: config/rules/aegis-core.rules
    mode: block
  # - name: et-open
  #   file: config/rules/emerging-all.rules
  #   mode: monitor     # mode is required; start imported rule sets in monitor

# Global WAF knobs: override a profile default here, or per route below.
waf:
  block_threshold: 5

# An exemption skips only what it names, and must say why and who owns it.
# skip accepts: rate_limit, waf, rule_set:<name>, sid:<number>
exemptions:
  - name: internal-scanner
    sources: [10.20.0.5]
    skip: [rate_limit, "rule_set:aegis-core"]
    reason: Weekly authenticated vulnerability scan
    owner: security-team@example.com

tls:
  - hostname: localhost
    mode: reverse_proxy          # transparent is accepted but not built yet
    certificate:
      type: file_watch
      cert_file: config/certs/localhost.crt
      key_file: config/certs/localhost.key

routes:
  - name: default
    host: "*"
    path_prefix: /
    backends:
      - 127.0.0.1:9001
      - 127.0.0.1:9002
    health:
      failures_to_eject: 3
      ejection_time: 5s
      count_server_errors: false
    connect_timeout: 2s
    response_timeout: 30s
    upstream_tls:
      enabled: false
      # trusted_ca: config/certs/origin-ca.pem
      # pinned_sha256: <64 hex digits>
    # Route-level overrides, all optional:
    # waf:
    #   body_scan_limit: 1MB
    #   on_body_over_limit: block
    # rule_sets:
    #   aegis-core: monitor
    # rules:
    #   - sid: 9000001
    #     mode: disabled
    #     score: 2
